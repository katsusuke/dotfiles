[settings]
experimental = true
idiomatic_version_file_enable_tools = ["node", "ruby", "python", "pnpm", "yarn"]
# awscli / stripe は Homebrew 版を使う (バージョン固定不要)
disable_tools = ["awscli", "stripe"]
minimum_release_age = "7d"
lockfile = true
lockfile_platforms = ["macos-arm64"]
paranoid = true

[tasks]
disable_paths = ["/Users/katsusuke/mnt", "/Volumes", "/Users/katsusuke/Downloads", "/Users/katsusuke/Desktop"]


[tools]
java = "liberica-17.0.21+11"
ruby = "latest"
"npm:@graphql-cli/init" = "latest"
node = "24"
erlang = "latest"
elixir = "latest"
bun = "latest"
